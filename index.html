<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEFES SWEETS</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6b9d;
    --pink-dark: #e8436f;
    --pink-light: #ff9ebd;
    --bg-dark: #ffffff;
    --bg-card: #fff5f7;
    --text-light: #1a1a1a;
    --text-muted: #8a7a7e;
    --gold: #e8a832;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: #fff;
    color: var(--text-light);
    touch-action: pan-x pan-y;
  }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: translateX(30px); }

  #landing { background: #fff; justify-content: flex-end; }
  .hero-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
  .video-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 30%, rgba(255,245,247,0.85) 100%); z-index: 1; pointer-events: none; }

  .lang-btn {
    position: absolute; top: 18px; right: 18px; z-index: 20;
    background: var(--pink);
    border: none; border-radius: 8px;
    padding: 8px 14px;
    color: #fff; font-size: 14px; font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 2px 12px rgba(255,107,157,0.3);
    transition: background 0.2s;
  }
  .lang-btn:hover { background: var(--pink-dark); }
  .lang-btn svg { width: 18px; height: 18px; }

  .global-lang-dropdown {
    position: absolute;
    top: 55px;
    right: 18px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    z-index: 30;
    width: 140px;
    overflow: hidden;
    display: none;
  }
  .global-lang-dropdown div {
    padding: 10px 16px;
    color: #333;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .global-lang-dropdown div:hover { background: var(--pink-light); color: white; }
  .lang-btn.active .global-lang-dropdown { display: block; }

  .wifi-badge {
    position: absolute; top: 12px; right: 18px; z-index: 20;
    background: var(--pink);
    border-radius: 8px; padding: 8px 12px;
    font-size: 13px; font-weight: 500; color: #fff;
    box-shadow: 0 2px 12px rgba(255,107,157,0.3);
    line-height: 1.4;
  }

  .landing-bottom { position: relative; z-index: 20; padding: 0 16px 24px; }
  .cta-btn { display: block; width: 100%; padding: 17px; border: none; border-radius: 10px; font-size: 17px; font-weight: 500; font-family: inherit; cursor: pointer; transition: transform 0.12s, filter 0.12s; letter-spacing: 0.3px; }
  .cta-btn:active { transform: scale(0.97); filter: brightness(0.9); }
  .cta-reserve { background: var(--pink); color: #fff; margin-bottom: 10px; }
  .cta-menu    { background: var(--pink-dark); color: #fff; }

  .social-row { display: flex; justify-content: center; gap: 10px; padding: 16px 0 8px; }
  .social-icon { width: 52px; height: 52px; background: var(--pink); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.12s; text-decoration: none; }
  .social-icon:active { transform: scale(0.9); }
  .social-icon svg { width: 26px; height: 26px; fill: #fff; }

  .brand-footer { text-align: center; padding-bottom: 10px; position: relative; z-index: 20; }
  .brand-footer .brand-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--pink-dark); letter-spacing: 1px; display: block; }
  .brand-footer .powered { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 2px; }

  #menu { background: var(--bg-dark); flex-direction: column; overflow: hidden; }
  .menu-header { background: var(--pink); padding: 14px 16px 0; flex-shrink: 0; }
  .menu-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .menu-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; color: #fff; text-align: center; flex: 1; }

  .lang-bar {
    background: var(--pink-dark);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
    cursor: pointer;
    font-size: 15px;
    color: #fff;
    position: relative;
  }
  .lang-dropdown {
    position: absolute;
    top: 45px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    z-index: 30;
    width: 140px;
    overflow: hidden;
    display: none;
  }
  .lang-dropdown div {
    padding: 10px 16px;
    color: #333;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .lang-dropdown div:hover { background: var(--pink-light); color: white; }
  .lang-bar.active .lang-dropdown { display: block; }

  .cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 0 14px; scrollbar-width: none; }
  .cat-scroll::-webkit-scrollbar { display: none; }
  .cat-item { flex-shrink: 0; background: var(--pink-dark); border-radius: 10px; padding: 10px 14px 8px; text-align: center; cursor: pointer; transition: background 0.2s, transform 0.12s; min-width: 80px; border: 2px solid transparent; }
  .cat-item.active { background: var(--pink-light); border-color: #fff; }
  .cat-item:active { transform: scale(0.94); }
  .cat-item span { font-size: 12px; color: #fff; display: block; font-weight: 500; }
  .menu-icon { width: 76px; height: 35px; object-fit: contain; display: inline-block; vertical-align: middle; font-weight: bold; }

  .search-bar-wrap { padding: 0 16px 12px; flex-shrink: 0; display: none; }
  .search-bar-wrap.visible { display: block; }
  .search-input { width: 100%; padding: 11px 16px; border-radius: 10px; border: 1px solid #ffe0e8; background: #fff; color: #1a1a1a; font-size: 15px; font-family: inherit; outline: none; }

  .food-grid-wrap { flex: 1; overflow-y: auto; padding: 12px 12px 80px; scrollbar-width: thin; }
  .food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .food-card { background: var(--bg-card); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.15s; position: relative; border: 1px solid #ffe0e8; }
  .food-card:active { transform: scale(0.97); }
  .food-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
  .food-card .card-body { padding: 8px 10px 10px; }
  .food-card .dish-name { font-size: 17px; font-weight: 700; color: var(--text-light); margin-bottom: 3px; line-height: 1.3; }
  .food-card .dish-price { font-size: 14px; color: var(--pink); font-weight: 700; }
  
  .back-btn { position: absolute; top: 14px; left: 10px; background: none; border: none; cursor: pointer; padding: 4px 8px; color: #fff; font-size: 22px; z-index: 20; line-height: 1; }

  .cart-fab { position: fixed; bottom: 24px; right: 20px; z-index: 100; width: 54px; height: 54px; background: var(--pink); border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 20px rgba(255,107,157,0.5); transition: transform 0.15s; display: none; }
  .cart-fab svg { width: 26px; height: 26px; fill: #fff; }
  .cart-fab .cart-count { position: absolute; top: -4px; right: -4px; background: var(--gold); color: #000; font-size: 11px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  #reserve { background: var(--bg-dark); }
  .reserve-header { background: var(--pink); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .reserve-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; color: #fff; }
  .reserve-body { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
  .form-input, .form-select { width: 100%; padding: 13px 14px; background: #fff; border: 1.5px solid #ffe0e8; border-radius: 10px; color: #1a1a1a; font-size: 15px; font-family: inherit; outline: none; }
  .submit-btn { width: 100%; padding: 17px; background: var(--pink); color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 500; font-family: inherit; cursor: pointer; margin-top: 8px; }
  .reserve-hero { width: 100%; height: 180px; background: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&q=80') center/cover; border-radius: 12px; margin-bottom: 24px; position: relative; overflow: hidden; }

  .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet { width: 100%; background: #fff; border-radius: 20px 20px 0 0; padding-bottom: 30px; transform: translateY(100%); transition: transform 0.35s cubic-bezier(.32,.72,0,1); }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-sheet img { width: 100%; height: 220px; object-fit: cover; border-radius: 20px 20px 0 0; }
  .modal-body { padding: 16px 20px; }
  .modal-name { font-size: 20px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }
  .modal-price { color: var(--pink); font-size: 20px; font-weight: 900; margin-bottom: 10px; }
  .modal-desc { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  .modal-close { position: absolute; top: 12px; right: 16px; background: rgba(0,0,0,0.5); border: none; width: 32px; height: 32px; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .modal-add { width: 100%; padding: 15px; background: var(--pink); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 500; font-family: inherit; cursor: pointer; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--pink); color: #fff; padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: 500; z-index: 300; transition: transform 0.35s; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .scroll-top { position: fixed; bottom: 88px; right: 20px; z-index: 99; width: 46px; height: 46px; background: var(--pink-dark); color: #fff; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,0.2); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .scroll-top.visible { opacity: 1; pointer-events: all; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 64px; margin-bottom: 16px; display: block; }
</style>
</head>

function getDishName(item) { return currentLang === 'tr' ? item.nameTr : item.nameKu; }
function getDishDesc(item) { return currentLang === 'tr' ? item.descTr : item.descKu; }
function translateText(key, fallback) { return (translations[currentLang]?.[key] || fallback); }

function renderCategories() { 
  const el = document.getElementById('catScroll'); 
  const cats = translations[currentLang]?.categories || translations.tr.categories; 
  el.innerHTML = categoriesList.map(c => `<div class="cat-item ${c.id===activeCat?'active':''}" onclick="selectCat('${c.id}')"><span class="menu-icon" style="font-size:px; line-height:1 font-weight: bold;">${icons[c.icon] ? icons[c.icon] : '🍽️'}</span><span>${cats[c.id] || c.id}</span></div>`).join(''); 
}
function selectCat(id) { activeCat = id; document.getElementById('searchInput').value = ''; renderMenu(); }
function renderMenu() { renderCategories(); const filtered = dishesData.filter(d => d.cat === activeCat); renderGrid(filtered); }
function renderGrid(items) { 
  const grid = document.getElementById('foodGrid'); 
  if (items.length === 0) { grid.innerHTML = `<div class="empty-state"><span class="icon">🍰</span><p>لڤان نێزیکا</p></div>`; return; } 
  grid.innerHTML = items.map(d => `<div class="food-card" onclick="openModal(${d.id})"><img src="${d.img}" alt="${getDishName(d)}" loading="lazy"><div class="card-body"><div class="dish-name">${getDishName(d)}</div><div class="dish-price">${d.price.toLocaleString()} IQD</div></div></div>`).join(''); 
}
function filterDishes(q) { if (!q) { renderMenu(); return; } const filtered = dishesData.filter(d => getDishName(d).toLowerCase().includes(q.toLowerCase()) || getDishDesc(d).toLowerCase().includes(q.toLowerCase())); renderGrid(filtered); }
function openModal(id) { modalItem = dishesData.find(d => d.id === id); if(!modalItem) return; document.getElementById('modalImg').src = modalItem.img; document.getElementById('modalName').textContent = getDishName(modalItem); document.getElementById('modalPrice').textContent = modalItem.price.toLocaleString() + ' IQD'; document.getElementById('modalDesc').textContent = getDishDesc(modalItem); document.getElementById('itemModal').classList.add('open'); }
function closeModal(e) { if(e.target === document.getElementById('itemModal')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('itemModal').classList.remove('open'); }
function addToCartFromModal() { if(modalItem) { cartCount++; const fab = document.getElementById('cartFab'); fab.style.display = 'flex'; document.getElementById('cartCount').textContent = cartCount; showToast(translateText('cartToast', 'Added to order ✓')); closeModalDirect(); } }
let toastTimer; function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
function submitReservation() { showToast(translateText('reserveToast', 'Reservation confirmed! 🎉')); setTimeout(() => showScreen('landing'), 1800); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); if(id === 'menu') { updateUILang(); renderMenu(); } }
function setLanguage(lang) { currentLang = lang; updateUILang(); if(!document.getElementById('menu').classList.contains('hidden')) renderMenu(); if(modalItem) { document.getElementById('modalName').textContent = getDishName(modalItem); document.getElementById('modalDesc').textContent = getDishDesc(modalItem); } }

  document.getElementById('submitReserveBtn').textContent = translateText('confirmBtn', 'Confirm Reservation'); 
  document.getElementById('searchInput').placeholder = translateText('searchPlaceholder', 'Search dishes...'); 
  const langLabel = currentLang === 'tr' ? 'Türkçe ▾' : 'کوردی ▾'; 
  document.getElementById('globalLangLabel').textContent = langLabel; 
  document.getElementById('menuLangLabel').textContent = langLabel; 
  document.getElementById('menuBtnLanding').innerHTML = currentLang === 'tr' ? 'Menü' : 'مینیو'; 
  renderCategories(); 
}
document.getElementById('menuBtnLanding').onclick = () => showScreen('menu');
const globalBtnWrapper = document.getElementById('globalLangBtnWrapper'); 
globalBtnWrapper.onclick = (e) => { e.stopPropagation(); globalBtnWrapper.classList.toggle('active'); }; 
document.querySelectorAll('#globalLangDropdown div').forEach(opt => { opt.onclick = (e) => { e.stopPropagation(); const lang = opt.getAttribute('data-lang'); setLanguage(lang); globalBtnWrapper.classList.remove('active'); }; });
const menuLangBar = document.getElementById('menuLangBar'); 
menuLangBar.onclick = (e) => { e.stopPropagation(); menuLangBar.classList.toggle('active'); }; 
document.querySelectorAll('#menuLangDropdown div').forEach(opt => { opt.onclick = (e) => { e.stopPropagation(); const lang = opt.getAttribute('data-lang'); setLanguage(lang); menuLangBar.classList.remove('active'); }; });
document.addEventListener('click', () => { globalBtnWrapper?.classList.remove('active'); menuLangBar?.classList.remove('active'); });
document.getElementById('foodGridWrap').addEventListener('scroll', function() { const btn = document.getElementById('scrollTop'); btn.classList.toggle('visible', this.scrollTop > 200); });
setLanguage('tr');
renderCategories();
</script>
</body>
</html>
