    /* ----- DESSERT-THEMED SKELETON LOADING ----- */
    .skeleton-card {
      background: #fff5f7;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ffe0e8;
      position: relative;
      cursor: default;
    }
    .skeleton-media {
      width: 100%;
      aspect-ratio: 1/1;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .skeleton-media::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 60%);
      animation: dessertShine 2.5s ease-in-out infinite;
    }
    @keyframes dessertShine {
      0% { transform: translateX(-100%) rotate(-15deg); opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateX(100%) rotate(-15deg); opacity: 0; }
    }
    .skeleton-icon {
      font-size: 48px;
      z-index: 2;
      animation: floatDessert 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }
    @keyframes floatDessert {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    .skeleton-body {
      padding: 8px 10px 10px;
    }
    .skeleton-text {
      height: 18px;
      background: linear-gradient(90deg, #f8bbd0 0%, #fce4ec 50%, #f8bbd0 100%);
      border-radius: 6px;
      margin: 0 0 6px 0;
      width: 80%;
      animation: pulseText 1.8s ease-in-out infinite;
    }
    .skeleton-price {
      height: 14px;
      background: linear-gradient(90deg, #f8bbd0 0%, #fce4ec 50%, #f8bbd0 100%);
      border-radius: 6px;
      width: 50%;
      animation: pulseText 1.8s ease-in-out infinite 0.3s;
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>

    // Function to auto-play videos in the grid
    function setupVideoPlayers() {
      document.querySelectorAll('.food-card video').forEach(video => {
        // Try to play the video
        const playVideo = () => {
          video.play().catch(() => {
            // If autoplay fails, wait for user interaction
            const playOnInteraction = () => {
              video.play().catch(() => {});
              document.removeEventListener('click', playOnInteraction);
            };
            document.addEventListener('click', playOnInteraction);
          });
        };
        
        // Handle visibility change to play when visible
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              video.play().catch(() => {});
            } else {
              video.pause();
            }
          });
        }, { threshold: 0.3 });
        
        observer.observe(video);
        
        // Also play on hover
        video.addEventListener('mouseenter', () => {
          video.play().catch(() => {});
        });
        video.addEventListener('mouseleave', () => {
          video.pause();
        });
        
        // Initial play attempt
        playVideo();
      });
    }

    function renderGrid(items) {
      const grid = document.getElementById('foodGrid');
      if (items.length === 0) { grid.innerHTML = `<div class="empty-state"><span class="icon">🍰</span><p>لڤان نێزیکا</p></div>`; return; }

      // Show skeletons first with dessert icons
      const skeletonCount = Math.min(items.length, 6);
      grid.innerHTML = renderSkeletons(skeletonCount);

      // After a short delay, render actual content
      clearTimeout(skeletonTimeout);
      skeletonTimeout = setTimeout(() => {
        grid.innerHTML = items.map(d => {
          const name = getDishName(d);
          const price = d.price !== undefined ? `${d.price.toLocaleString()} IQD` : '🎬 VIP Video';
          let mediaHtml;
          if (d.isVideo) {
            mediaHtml = `<video src="${d.img}" muted playsinline loop preload="metadata" onclick="openModal(${d.id})" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000;cursor:pointer;"></video>`;
          } else {
            mediaHtml = `<img src="${d.img}" alt="${name}" loading="lazy" onclick="openModal(${d.id})" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer;">`;
          }
          return `<div class="food-card">${mediaHtml}<div class="card-body"><div class="dish-name">${name}</div><div class="dish-price">${price}</div></div></div>`;
        }).join('');

        // Setup video players for VIP videos
        setupVideoPlayers();

        // Attach click events for non-video cards
        document.querySelectorAll('.food-card').forEach((card, index) => {
          const item = items[index];
          if (!item) return;
          if (!item.isVideo) {
            card.onclick = () => openModal(item.id);
          }
        });
      }, 600);
    }

    function filterDishes(q) {
      if (!q) { renderMenu(); return; }
      const filtered = dishesData.filter(d => getDishName(d).toLowerCase().includes(q.toLowerCase()) || getDishDesc(d).toLowerCase().includes(q.toLowerCase()));
      renderGrid(filtered);
    }

    function openModal(id) {
      modalItem = dishesData.find(d => d.id === id);
      if (!modalItem) return;
      const container = document.getElementById('modalMediaContainer');
      if (modalItem.isVideo) {
        container.innerHTML = `<video src="${modalItem.img}" controls autoplay muted playsinline style="width:100%;height:220px;object-fit:cover;border-radius:20px 20px 0 0;background:#000;"></video>`;
        // Ensure video plays in modal
        setTimeout(() => {
          const vid = container.querySelector('video');
          if (vid) vid.play().catch(() => {});
        }, 100);
      } else {
        container.innerHTML = `<img src="${modalItem.img}" alt="${getDishName(modalItem)}" style="width:100%;height:220px;object-fit:cover;border-radius:20px 20px 0 0;">`;
      }
      document.getElementById('modalName').textContent = getDishName(modalItem) || 'VIP Video';
      document.getElementById('modalPrice').textContent = modalItem.price !== undefined ? `${modalItem.price.toLocaleString()} IQD` : '';
      document.getElementById('modalDesc').textContent = getDishDesc(modalItem) || '';
      document.getElementById('itemModal').classList.add('open');
    }

    function closeModal(e) { if (e.target === document.getElementById('itemModal')) closeModalDirect(); }
    function closeModalDirect() { 
      document.getElementById('itemModal').classList.remove('open');
      const vid = document.querySelector('#modalMediaContainer video');
      if (vid) vid.pause();
    }

    function addToCartFromModal() {
      if (modalItem) {
        cartCount++;
        const fab = document.getElementById('cartFab');
        fab.style.display = 'flex';
        document.getElementById('cartCount').textContent = cartCount;
        showToast(translateText('cartToast', 'Added to order ✓'));
        closeModalDirect();
      }
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function submitReservation() {
      showToast(translateText('reserveToast', 'Reservation confirmed! 🎉'));
      setTimeout(() => showScreen('landing'), 1800);
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      if (id === 'menu') { updateUILang(); renderMenu(); }
    }

    function setLanguage(lang) {
      currentLang = lang;
      updateUILang();
      if (!document.getElementById('menu').classList.contains('hidden')) renderMenu();
      if (modalItem) {
        document.getElementById('modalName').textContent = getDishName(modalItem) || 'VIP Video';
        document.getElementById('modalDesc').textContent = getDishDesc(modalItem) || '';
      }
    }

    function updateUILang() {
      document.getElementById('menuTitle').textContent = translateText('menuTitle', 'NEFES SWEETS');
      document.getElementById('reserveTitle').textContent = translateText('reserveTitle', 'Reserve a Table');
      document.getElementById('labelName').textContent = translateText('labelName', 'Full Name');
      document.getElementById('labelPhone').textContent = translateText('labelPhone', 'Phone Number');
      document.getElementById('labelDate').textContent = translateText('labelDate', 'Date');
      document.getElementById('labelTime').textContent = translateText('labelTime', 'Time');
      document.getElementById('labelGuests').textContent = translateText('labelGuests', 'Number of Guests');
      document.getElementById('labelRequests').textContent = translateText('labelRequests', 'Special Requests');
      document.getElementById('submitReserveBtn').textContent = translateText('confirmBtn', 'Confirm Reservation');
      document.getElementById('searchInput').placeholder = translateText('searchPlaceholder', 'Search dishes...');
      const langLabel = currentLang === 'tr' ? 'Türkçe ▾' : 'کوردی ▾';
      document.getElementById('globalLangLabel').textContent = langLabel;
      document.getElementById('menuLangLabel').textContent = langLabel;
      document.getElementById('menuBtnLanding').innerHTML = currentLang === 'tr' ? 'Menü' : 'مینیو';
      renderCategories();
    }

    // Event listeners
    document.getElementById('menuBtnLanding').onclick = () => showScreen('menu');

    const globalBtnWrapper = document.getElementById('globalLangBtnWrapper');
    globalBtnWrapper.onclick = (e) => { e.stopPropagation(); globalBtnWrapper.classList.toggle('active'); };
    document.querySelectorAll('#globalLangDropdown div').forEach(opt => {
      opt.onclick = (e) => { e.stopPropagation(); const lang = opt.getAttribute('data-lang'); setLanguage(lang); globalBtnWrapper.classList.remove('active'); };
    });

    const menuLangBar = document.getElementById('menuLangBar');
    menuLangBar.onclick = (e) => { e.stopPropagation(); menuLangBar.classList.toggle('active'); };
    document.querySelectorAll('#menuLangDropdown div').forEach(opt => {
      opt.onclick = (e) => { e.stopPropagation(); const lang = opt.getAttribute('data-lang'); setLanguage(lang); menuLangBar.classList.remove('active'); };
    });

    document.addEventListener('click', () => { globalBtnWrapper?.classList.remove('active'); menuLangBar?.classList.remove('active'); });

    document.getElementById('foodGridWrap').addEventListener('scroll', function() {
      const btn = document.getElementById('scrollTop');
      btn.classList.toggle('visible', this.scrollTop > 200);
    });

    // Initial setup
    setLanguage('tr');
    renderCategories();
    renderMenu();
  </script>
</body>
</html>
