<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEFES SWEETS · modern</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: #fbf7f5; color: #1e1a1a; touch-action: pan-x pan-y; }

    /* ===== SCREENS ===== */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1), transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); will-change: transform, opacity; }
    .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.94) translateY(20px); }

    /* ===== LANDING ===== */
    #landing { background: #fff; justify-content: flex-end; }
    .hero-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
    .video-overlay { position: absolute; inset: 0; background: linear-gradient(145deg, rgba(255,215,215,0.10) 0%, rgba(255,235,240,0.65) 70%, rgba(255,245,247,0.92) 100%); z-index: 1; pointer-events: none; backdrop-filter: blur(1px); }

    /* floating bubbles + sparkle */
    .bubble { position: absolute; border-radius: 50%; background: rgba(255, 107, 157, 0.08); z-index: 1; pointer-events: none; animation: floatBubble 18s infinite alternate ease-in-out; }
    .bubble:nth-child(1) { width: 180px; height: 180px; top: 10%; left: -40px; animation-duration: 22s; }
    .bubble:nth-child(2) { width: 260px; height: 260px; bottom: 20%; right: -60px; animation-duration: 28s; background: rgba(255, 180, 200, 0.10); }
    @keyframes floatBubble { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, -30px) scale(1.05); } }

    /* sparkle */
    .sparkle { position: absolute; width: 8px; height: 8px; background: #ffb6c9; border-radius: 50%; z-index: 1; pointer-events: none; animation: sparkleFade 4s infinite alternate; }
    .sparkle:nth-child(3) { top: 15%; left: 20%; animation-delay: 0.5s; width: 12px; height: 12px; }
    .sparkle:nth-child(4) { top: 70%; left: 80%; animation-delay: 1.2s; width: 6px; height: 6px; }
    .sparkle:nth-child(5) { top: 40%; left: 10%; animation-delay: 2s; width: 10px; height: 10px; }
    @keyframes sparkleFade { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1.2); } }

    .lang-btn { position: absolute; top: 20px; right: 20px; z-index: 20; background: rgba(255, 107, 157, 0.9); backdrop-filter: blur(8px); border: none; border-radius: 40px; padding: 10px 18px; color: #fff; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: inherit; box-shadow: 0 8px 24px rgba(255,107,157,0.25); transition: all 0.25s; letter-spacing: 0.3px; }
    .lang-btn:hover { background: #ff4d82; transform: scale(1.02); }
    .global-lang-dropdown { position: absolute; top: 58px; right: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(12px); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); z-index: 30; width: 150px; overflow: hidden; display: none; padding: 6px 0; }
    .global-lang-dropdown div { padding: 12px 20px; color: #1e1a1a; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .global-lang-dropdown div:hover { background: #ff9ebd; color: #fff; padding-left: 26px; }
    .lang-btn.active .global-lang-dropdown { display: block; }

    .wifi-badge { position: absolute; top: 15px; left: 2px; z-index: 20; background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); border-radius: 40px; padding: 3px 12px; font-size: 13px; font-weight: 500; color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.10); line-height: 1.4; border: 1px solid rgba(255,255,255,0.15); }
    .wifi-badge span { opacity: 0.8; }

    .landing-bottom { position: relative; z-index: 20; padding: 0 20px 30px; width: 100%; max-width: 480px; margin: 0 auto; animation: fadeUp 1s ease 0.2s both; }
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }

    .cta-btn { display: block; width: 100%; padding: 18px; border: none; border-radius: 60px; font-size: 18px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s ease; letter-spacing: 0.5px; box-shadow: 0 8px 24px rgba(255,107,157,0.25); }
    .cta-btn:active { transform: scale(0.94); filter: brightness(0.92); }
    .cta-reserve { background: #ff6b9d; color: #fff; margin-bottom: 12px; }
    .cta-reserve:hover { background: #ff4d82; transform: translateY(-3px) scale(1.01); box-shadow: 0 12px 32px rgba(255,107,157,0.35); }
    .cta-menu    { background: #e8436f; color: #fff; }
    .cta-menu:hover { background: #d42a5a; transform: translateY(-3px) scale(1.01); box-shadow: 0 12px 32px rgba(232,67,111,0.35); }

    .social-row { display: flex; justify-content: center; gap: 14px; padding: 22px 0 14px; flex-wrap: wrap; }
    .social-icon { width: 56px; height: 56px; background: rgba(255, 107, 157, 0.12); backdrop-filter: blur(4px); border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.25s; text-decoration: none; border: 1px solid rgba(255,107,157,0.10); }
    .social-icon:hover { background: #ff6b9d; transform: translateY(-6px) scale(1.05); box-shadow: 0 12px 28px rgba(255,107,157,0.25); }
    .social-icon svg { width: 26px; height: 26px; fill: #1e1a1a; transition: fill 0.2s; }
    .social-icon:hover svg { fill: #fff; }

    .brand-footer { text-align: center; padding: 6px 0 4px; position: relative; z-index: 20; }
    .brand-footer .brand-name { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: #e8436f; letter-spacing: 2px; display: block; text-shadow: 0 2px 8px rgba(232,67,111,0.10); animation: glowPulse 3s infinite alternate; }
    @keyframes glowPulse { 0% { text-shadow: 0 2px 8px rgba(232,67,111,0.10); } 100% { text-shadow: 0 4px 20px rgba(232,67,111,0.25); } }
    .brand-footer .powered { font-size: 11px; color: #8a7a7e; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }

    /* ===== MENU ===== */
    #menu { background: #fbf7f5; flex-direction: column; overflow: hidden; }
    .menu-header { 
      background: linear-gradient(145deg, #ff6b9d, #e8436f); 
      padding: 16px 16px 0; 
      flex-shrink: 0; 
      border-radius: 0 0 32px 32px; 
      box-shadow: 0 8px 30px rgba(232,67,111,0.25); 
      position: relative; 
      z-index: 2; 
      animation: slideDown 0.6s ease both; 
    }
    @keyframes slideDown { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
    .menu-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .menu-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: #fff; text-align: center; flex: 1; letter-spacing: 1px; }

    /* ---- FIXED: lang-bar stays above categories with high z-index ---- */
    .lang-bar {
      background: rgba(255,255,255,0.20);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      cursor: pointer;
      font-size: 15px;
      color: #fff;
      position: relative;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.20);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      animation: langBarPulse 2s infinite alternate ease-in-out;
      transform-origin: center;
      letter-spacing: 0.5px;
      z-index: 25;
    }
    @keyframes langBarPulse {
      0% { box-shadow: 0 4px 16px rgba(255,255,255,0.10); transform: scale(1); }
      100% { box-shadow: 0 8px 32px rgba(255,255,255,0.25); transform: scale(1.01); }
    }
    .lang-bar:hover {
      background: rgba(255,255,255,0.35);
      transform: scale(1.02) translateY(-2px);
      box-shadow: 0 12px 40px rgba(255,255,255,0.20);
    }
    .lang-bar:active { transform: scale(0.96); }
    .lang-bar svg { transition: transform 0.4s; }
    .lang-bar:hover svg { transform: rotate(180deg); }
    .lang-dropdown {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.15);
      z-index: 999;
      width: 160px;
      overflow: hidden;
      display: none;
      padding: 8px 0;
      animation: dropdownSlide 0.3s ease both;
    }
    @keyframes dropdownSlide {
      0% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.96); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .lang-dropdown div {
      padding: 14px 24px;
      color: #1e1a1a;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      border-radius: 12px;
      margin: 2px 6px;
    }
    .lang-dropdown div:hover {
      background: #ff6b9d;
      color: #fff;
      transform: scale(1.02);
    }
    .lang-bar.active .lang-dropdown { display: block; }

    .cat-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 0 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      position: relative;
      z-index: 20;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-item {
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      border-radius: 60px;
      padding: 8px 16px 8px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      min-width: 70px;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-item.active {
      background: #fff;
      border-color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      transform: scale(1.04);
    }
    .cat-item.active span { color: #e8436f; font-weight: 700; }
    .cat-item:active { transform: scale(0.92); }
    .cat-item span { font-size: 13px; color: #fff; font-weight: 500; white-space: nowrap; }
    .menu-icon { width: 28px; height: 28px; object-fit: contain; display: inline-block; vertical-align: middle; }

    .search-bar-wrap { padding: 0 16px 14px; flex-shrink: 0; display: none; animation: fadeIn 0.4s ease; }
    .search-bar-wrap.visible { display: block; }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }
    .search-input { width: 100%; padding: 14px 18px; border-radius: 60px; border: 1.5px solid rgba(255,107,157,0.15); background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); color: #1a1a1a; font-size: 15px; font-family: inherit; outline: none; transition: all 0.3s; box-shadow: 0 2px 12px rgba(0,0,0,0.02); }
    .search-input:focus { border-color: #ff6b9d; background: #fff; box-shadow: 0 4px 20px rgba(255,107,157,0.08); transform: scale(1.01); }

    .food-grid-wrap { flex: 1; overflow-y: auto; padding: 8px 12px 100px; scrollbar-width: thin; }
    .food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* card modern + hover animations */
    .food-card { background: #ffffff; border-radius: 28px; overflow: hidden; cursor: pointer; transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1); border: 1px solid rgba(255,107,157,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.02); animation: cardPop 0.5s ease both; }
    .food-card:nth-child(1) { animation-delay: 0.05s; }
    .food-card:nth-child(2) { animation-delay: 0.10s; }
    .food-card:nth-child(3) { animation-delay: 0.15s; }
    .food-card:nth-child(4) { animation-delay: 0.20s; }
    .food-card:nth-child(5) { animation-delay: 0.25s; }
    .food-card:nth-child(6) { animation-delay: 0.30s; }
    @keyframes cardPop { 0% { opacity: 0; transform: scale(0.92) translateY(12px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .food-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 48px rgba(232,67,111,0.12); border-color: rgba(255,107,157,0.20); }
    .food-card:active { transform: scale(0.94); }
    .food-card video, .food-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #f3e9ec; transition: transform 0.4s; }
    .food-card:hover video, .food-card:hover img { transform: scale(1.02); }
    .food-card .card-body { padding: 12px 14px 14px; }
    .food-card .dish-name { font-size: 16px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; line-height: 1.3; letter-spacing: -0.2px; }
    .food-card .dish-price { font-size: 14px; color: #ff6b9d; font-weight: 700; display: inline-block; background: rgba(255,107,157,0.08); padding: 2px 12px; border-radius: 40px; transition: all 0.3s; }
    .food-card:hover .dish-price { background: rgba(255,107,157,0.18); transform: scale(1.02); }

    .back-btn { background: rgba(255,255,255,0.15); backdrop-filter: blur(6px); border: none; cursor: pointer; padding: 6px 10px; border-radius: 40px; color: #fff; font-size: 20px; z-index: 20; line-height: 1; transition: all 0.25s; }
    .back-btn:hover { background: rgba(255,255,255,0.30); transform: rotate(-8deg); }

    .cart-fab { position: fixed; bottom: 28px; right: 20px; z-index: 100; width: 60px; height: 60px; background: linear-gradient(145deg, #ff6b9d, #e8436f); border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 32px rgba(255,107,157,0.45); transition: all 0.3s; display: none; animation: fabPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes fabPop { 0% { opacity: 0; transform: scale(0.5) rotate(-20deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
    .cart-fab:hover { transform: scale(1.08) translateY(-6px); box-shadow: 0 16px 48px rgba(255,107,157,0.55); }
    .cart-fab svg { width: 28px; height: 28px; fill: #fff; }
    .cart-fab .cart-count { position: absolute; top: -6px; right: -6px; background: #f5b042; color: #1a1a1a; font-size: 12px; font-weight: 700; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(245,176,66,0.4); animation: countPop 0.3s ease; }
    @keyframes countPop { 0% { transform: scale(0.6); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

    /* ===== RESERVE ===== */
    #reserve { background: #fbf7f5; }
    .reserve-header { background: linear-gradient(145deg, #ff6b9d, #e8436f); padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-radius: 0 0 32px 32px; box-shadow: 0 8px 30px rgba(232,67,111,0.20); animation: slideDown 0.5s ease both; }
    .reserve-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: #fff; letter-spacing: 1px; }
    .reserve-body { flex: 1; overflow-y: auto; padding: 24px 20px; animation: fadeUp 0.6s ease 0.1s both; }
    .reserve-hero { width: 100%; height: 160px; background: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&q=80') center/cover; border-radius: 28px; margin-bottom: 28px; position: relative; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.04); transition: transform 0.4s; }
    .reserve-hero:hover { transform: scale(1.01); }
    .form-group { margin-bottom: 20px; animation: fadeUp 0.5s ease both; }
    .form-group:nth-child(2) { animation-delay: 0.05s; }
    .form-group:nth-child(3) { animation-delay: 0.10s; }
    .form-group:nth-child(4) { animation-delay: 0.15s; }
    .form-group:nth-child(5) { animation-delay: 0.20s; }
    .form-group:nth-child(6) { animation-delay: 0.25s; }
    .form-label { display: block; font-size: 13px; color: #8a7a7e; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.3px; }
    .form-input, .form-select { width: 100%; padding: 14px 16px; background: #fff; border: 1.5px solid rgba(255,107,157,0.10); border-radius: 60px; color: #1a1a1a; font-size: 15px; font-family: inherit; outline: none; transition: all 0.3s; }
    .form-input:focus, .form-select:focus { border-color: #ff6b9d; box-shadow: 0 4px 20px rgba(255,107,157,0.08); transform: scale(1.01); }
    .submit-btn { width: 100%; padding: 18px; background: linear-gradient(145deg, #ff6b9d, #e8436f); color: #fff; border: none; border-radius: 60px; font-size: 17px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 8px; box-shadow: 0 8px 28px rgba(255,107,157,0.30); transition: all 0.3s; }
    .submit-btn:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 14px 40px rgba(255,107,157,0.40); }
    .submit-btn:active { transform: scale(0.94); }

    /* ===== MODAL ===== */
    .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.55); backdrop-filter: blur(12px); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-sheet { width: 100%; max-width: 460px; margin: 0 auto; background: #fff; border-radius: 40px 40px 0 0; padding-bottom: 30px; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1); box-shadow: 0 -20px 60px rgba(0,0,0,0.10); }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }
    .modal-sheet video, .modal-sheet img { width: 100%; height: 240px; object-fit: cover; border-radius: 40px 40px 0 0; background: #f3e9ec; }
    .modal-body { padding: 20px 24px; }
    .modal-name { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
    .modal-price { color: #ff6b9d; font-size: 22px; font-weight: 900; margin-bottom: 8px; }
    .modal-desc { color: #6a5a5e; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .modal-close { position: absolute; top: 16px; right: 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; transition: all 0.3s; }
    .modal-close:hover { background: rgba(0,0,0,0.6); transform: rotate(90deg); }
    .modal-add { width: 100%; padding: 16px; background: linear-gradient(145deg, #ff6b9d, #e8436f); color: #fff; border: none; border-radius: 60px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: 0 6px 24px rgba(255,107,157,0.30); transition: all 0.3s; }
    .modal-add:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(255,107,157,0.40); }

    .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #1e1a1a; color: #fff; padding: 14px 28px; border-radius: 60px; font-size: 14px; font-weight: 500; z-index: 300; transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1); white-space: nowrap; box-shadow: 0 12px 40px rgba(0,0,0,0.25); backdrop-filter: blur(8px); }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .scroll-top { position: fixed; bottom: 100px; right: 20px; z-index: 99; width: 48px; height: 48px; background: rgba(232,67,111,0.9); backdrop-filter: blur(8px); color: #fff; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.10); opacity: 0; pointer-events: none; transition: all 0.4s; }
    .scroll-top.visible { opacity: 1; pointer-events: all; }
    .scroll-top:hover { background: #e8436f; transform: scale(1.08) translateY(-4px); }

    /* skeleton */
    .skeleton-card { background: #fff; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,107,157,0.04); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    .skeleton-media { width: 100%; aspect-ratio: 1/1; background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .skeleton-media::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5) 0%, transparent 60%); animation: dessertShine 2.8s ease-in-out infinite; }
    @keyframes dessertShine { 0% { transform: translateX(-100%) rotate(-15deg); opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { transform: translateX(100%) rotate(-15deg); opacity: 0; } }
    .skeleton-icon { font-size: 52px; z-index: 2; animation: floatDessert 2.4s ease-in-out infinite; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.06)); }
    @keyframes floatDessert { 0%, 100% { transform: translateY(0px) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
    .skeleton-body { padding: 12px 14px 14px; }

        Organicjuice: ['شەربەت پڕتەقال','شەربەت لیمون','شەربەت کیوی','شەربەت فراولە','شەربەت موز','شەربەت ئەناناس','شەربەت کیوی و لیمون','شەربەت هەنار','شەربەت ئاڤوگادو','شەربەت مانگو'],
        Conafe: ['کونافە فستەق','کونافە مشەکل','کونافە قەیماخ','کونافە پەنیر'],
        Milkshake: ['فراولە میلکشێک','بلوبێری میلکشێک','کیندەر میلکشێک','ئوریو میلکشێک','نوتێلا میلکشێک','لوتوس میلکشێک','فستەق میلکشێک','کەرامێل میلکشێک','چوکلێت میلکشێک'],
        Icecream: ['دۆدرمای موز','دۆدرمای فستەق','دۆدرمای چیکولاتا','دۆدرمای بلوبێری','دۆدرمای فراولە','دۆدرمای مانگو','دۆدرمای لیمون','ئەزبەری پڕتەقال','ئەزبەری بلوبێری و فراولە'],
        Baklava: ['میدیای بەقلاوە ۱ لە','سادە بەقلاوە ۱ لە','سارمای بەقلاوە ۱ لە','دیلبەر دۆدایی بەقلاوە ۱ لە','دونەری بەقلاوە ۱ لە','تەشریف ۲ لە بەقلاوە']
      };
      const priceRanges = { VIP:[], ColdDrink:[1000,1000,1000,2000,2000,3000,2000,3000,3000,3000,3000,3000,3000], 'Hot Drinks':[3000,3000,3000,2000,3000,3000,3000,3000,2000,4000,500,3000,2000,1500,3000,3000], Cakes:[2000,3000,1500,500,500,1500,1000,3000,2000,2000,2000,2000,2000,3000,1500,3000,1000,3000,2000,2000,2000,3000,2000,2000,3000], Smothy:[4000,4000,4000,4000,4000,4000,4000], Mohito:[3000,3000,3000,3000,3000,3000,3000,3000,3000,4000,4000], Creap:[5000,5000,5000,6000,5000,5000,5000,5000,5000,5000,4000,5000,5000,4000,5000,5000], Organicjuice:[3000,3000,3000,3000,3000,3000,3000,3000,4000,5000], Conafe:[5000,6000,7000,5000], Milkshake:[3000,3000,3000,3000,3000,3000,3000,3000,3000], Icecream:[500,500,500,500,500,500,500,1000,1000], Baklava:[1000,1000,1000,1000,1000,5000] };

      const vipVideos = categoryImages.VIP;
      for (let i=0; i<7; i++) { products.push({ id:pid++, cat:'VIP', nameTr:'VIP Video '+(i+1), nameKu:'ڤیدیۆی ڤیپ '+(i+1), price:undefined, img:vipVideos[i%vipVideos.length], isVideo:true }); }
      for (const cat of categories) {
        if (cat==='VIP') continue;
        const images = categoryImages[cat], namesTr = nameTrMap[cat], namesKu = nameKuMap[cat], prices = priceRanges[cat];
        for (let i=0; i<Math.min(namesTr.length, namesKu.length, prices.length); i++) {
          products.push({ id:pid++, cat, nameTr:namesTr[i], nameKu:namesKu[i], price:prices[i], img:images[i%images.length], isVideo:false });
        }
      }
      return products;
    }

    let dishesData = generateSampleProducts();

    const icons = {
      VIP: `<span style="display:inline-block; padding:2px 10px; background:linear-gradient(135deg,#FFD700,#FFA500); color:#000; font-size:16px; font-weight:700; border-radius:40px; letter-spacing:0.5px;">VIP</span>`,
      ColdDrink: `<img src="image/drink.png" class="menu-icon" onerror="this.style.display='none'">`,
      HotDrinks: `<img src="image/coffee-cup.png" class="menu-icon" onerror="this.style.display='none'">`,
      Cakes: `<img src="image/cake.png" class="menu-icon" onerror="this.style.display='none'">`,
      Smothy: `<img src="image/smoothie.png" class="menu-icon" onerror="this.style.display='none'">`,
      Mohito: `<img src="image/mojito.png" class="menu-icon" onerror="this.style.display='none'">`,
      Creap: `<img src="image/crepe.png" class="menu-icon" onerror="this.style.display='none'">`,
      Organicjuice: `<img src="image/orange-juice.png" class="menu-icon" onerror="this.style.display='none'">`,
      Conafe: `<img src="image/kunafa.png" class="menu-icon" onerror="this.style.display='none'">`,
      Milkshake: `<img src="image/milk-shake.png" class="menu-icon" onerror="this.style.display='none'">`,
      Icecream: `<img src="image/ice-cream.png" class="menu-icon" onerror="this.style.display='none'">`,
      Baklava: `<img src="image/baklava.png" class="menu-icon" onerror="this.style.display='none'">`
    };

    const categoriesList = [
      { id:'VIP', icon:'VIP' }, { id:'ColdDrink', icon:'ColdDrink' }, { id:'Hot Drinks', icon:'HotDrinks' }, { id:'Cakes', icon:'Cakes' },
      { id:'Smothy', icon:'Smothy' }, { id:'Mohito', icon:'Mohito' }, { id:'Creap', icon:'Creap' }, { id:'Organicjuice', icon:'Organicjuice' },
      { id:'Conafe', icon:'Conafe' }, { id:'Milkshake', icon:'Milkshake' }, { id:'Icecream', icon:'Icecream' }, { id:'Baklava', icon:'Baklava' }
    ];

    function getDishName(item) { return item.isVideo ? '🎬 '+(currentLang==='tr'?item.nameTr:item.nameKu) : (currentLang==='tr'?item.nameTr:item.nameKu); }
    function getDishDesc(item) { return item.isVideo ? '' : (currentLang==='tr'?(item.descTr||''):(item.descKu||'')); }
    function translateText(key, fallback) { return translations[currentLang]?.[key] || fallback; }

    function renderCategories() {
      const el = document.getElementById('catScroll');
      const cats = translations[currentLang]?.categories || translations.tr.categories;
      el.innerHTML = categoriesList.map(c => `<div class="cat-item ${c.id===activeCat?'active':''}" onclick="selectCat('${c.id}')"><span style="font-size:20px; line-height:1;">${icons[c.icon]||'🍽️'}</span><span>${cats[c.id]||c.id}</span></div>`).join('');
    }

    function selectCat(id) { activeCat = id; document.getElementById('searchInput').value = ''; renderMenu(); }

    function renderMenu() { renderCategories(); const filtered = dishesData.filter(d => d.cat === activeCat); renderGrid(filtered); }

    // skeleton
    const dessertIcons = ['🍰','🧁','🥧','🍫','🍩','🍪','🎂','🍭','🧇','🍦'];
    function renderSkeletons(count) {
      let html = '';
      for (let i=0; i<count; i++) {
        const randomIcon = dessertIcons[Math.floor(Math.random()*dessertIcons.length)];
        html += `<div class="skeleton-card"><div class="skeleton-media"><span class="skeleton-icon" style="font-size:52px; animation: floatDessert ${1.4+Math.random()*1.6}s ease-in-out infinite;">${randomIcon}</span></div><div class="skeleton-body"><div class="skeleton-text" style="width:${60+Math.random()*35}%;"></div><div class="skeleton-price" style="width:${30+Math.random()*30}%;"></div></div></div>`;
      }
      return html;
    }

    function setupVideoPlayers() {
      document.querySelectorAll('.food-card video').forEach(video => {
        const play = () => video.play().catch(() => {});
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => { if (entry.isIntersecting) play(); else video.pause(); });
        }, { threshold:0.3 });
        observer.observe(video);
        video.addEventListener('mouseenter', play);
        video.addEventListener('mouseleave', () => video.pause());
        play();
      });
    }

    function renderGrid(items) {
      const grid = document.getElementById('foodGrid');
      if (items.length===0) { grid.innerHTML = `<div class="empty-state" style="text-align:center;padding:60px 20px;color:#8a7a7e;"><span style="font-size:64px;display:block;margin-bottom:12px;">🍰</span><p>لڤان نێزیکا</p></div>`; return; }
      const skeletonCount = Math.min(items.length, 6);
      grid.innerHTML = renderSkeletons(skeletonCount);
      clearTimeout(skeletonTimeout);
      skeletonTimeout = setTimeout(() => {
        grid.innerHTML = items.map(d => {
          const name = getDishName(d);
          const price = d.price!==undefined ? `${d.price.toLocaleString()} IQD` : '🎬 VIP Video';
          let mediaHtml;
          if (d.isVideo) mediaHtml = `<video src="${d.img}" muted playsinline loop preload="metadata" onclick="openModal(${d.id})" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f3e9ec;cursor:pointer;"></video>`;
          else mediaHtml = `<img src="${d.img}" alt="${name}" loading="lazy" onclick="openModal(${d.id})" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer;">`;
          return `<div class="food-card">${mediaHtml}<div class="card-body"><div class="dish-name">${name}</div><div class="dish-price">${price}</div></div></div>`;
        }).join('');
        setupVideoPlayers();
        document.querySelectorAll('.food-card').forEach((card, idx) => {
          const item = items[idx];
          if (item && !item.isVideo) card.onclick = () => openModal(item.id);
        });
      }, 500);
    }

    function filterDishes(q) {
      if (!q) { renderMenu(); return; }
      const filtered = dishesData.filter(d => getDishName(d).toLowerCase().includes(q.toLowerCase()) || getDishDesc(d).toLowerCase().includes(q.toLowerCase()));
      renderGrid(filtered);
    }

    function openModal(id) {
      modalItem = dishesData.find(d => d.id === id);
      if (!modalItem) return;
      const container = document.getElementById('modalMediaContainer');
      if (modalItem.isVideo) {
        container.innerHTML = `<video src="${modalItem.img}" controls autoplay muted playsinline style="width:100%;height:240px;object-fit:cover;border-radius:40px 40px 0 0;background:#f3e9ec;"></video>`;
        setTimeout(() => { const v = container.querySelector('video'); if(v) v.play().catch(()=>{}); }, 100);
      } else {
        container.innerHTML = `<img src="${modalItem.img}" alt="${getDishName(modalItem)}" style="width:100%;height:240px;object-fit:cover;border-radius:40px 40px 0 0;">`;
      }
      document.getElementById('modalName').textContent = getDishName(modalItem);
      document.getElementById('modalPrice').textContent = modalItem.price!==undefined ? `${modalItem.price.toLocaleString()} IQD` : '';
      document.getElementById('modalDesc').textContent = getDishDesc(modalItem);
      document.getElementById('itemModal').classList.add('open');
    }

    function closeModal(e) { if (e.target === document.getElementById('itemModal')) closeModalDirect(); }
    function closeModalDirect() { document.getElementById('itemModal').classList.remove('open'); const v = document.querySelector('#modalMediaContainer video'); if(v) v.pause(); }

    function addToCartFromModal() {
      if (modalItem) {
        cartCount++;
        const fab = document.getElementById('cartFab');
        fab.style.display = 'flex';
        document.getElementById('cartCount').textContent = cartCount;
        closeModalDirect();
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }
    let toastTimer;

    function submitReservation() { showToast(translateText('reserveToast','Rezervasyon onaylandı! 🎉')); setTimeout(()=>showScreen('landing'), 1600); }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      if (id === 'menu') { updateUILang(); renderMenu(); }
    }

    function setLanguage(lang) {
      currentLang = lang;
      updateUILang();
      if (!document.getElementById('menu').classList.contains('hidden')) renderMenu();
      if (modalItem) { document.getElementById('modalName').textContent = getDishName(modalItem); document.getElementById('modalDesc').textContent = getDishDesc(modalItem); }
    }

    function updateUILang() {
      document.getElementById('menuTitle').textContent = translateText('menuTitle','NEFES SWEETS');
      document.getElementById('reserveTitle').textContent = translateText('reserveTitle','Reserve a Table');
      document.getElementById('labelName').textContent = translateText('labelName','Full Name');
      document.getElementById('labelPhone').textContent = translateText('labelPhone','Phone Number');
      document.getElementById('labelDate').textContent = translateText('labelDate','Date');
      document.getElementById('labelTime').textContent = translateText('labelTime','Time');
      document.getElementById('labelGuests').textContent = translateText('labelGuests','Number of Guests');
      document.getElementById('labelRequests').textContent = translateText('labelRequests','Special Requests');
      document.getElementById('submitReserveBtn').textContent = translateText('confirmBtn','Confirm Reservation');
      document.getElementById('searchInput').placeholder = translateText('searchPlaceholder','Search dishes...');
      const lbl = currentLang==='tr' ? 'Türkçe ▾' : 'کوردی ▾';
      document.getElementById('globalLangLabel').textContent = lbl;
      document.getElementById('menuLangLabel').textContent = lbl;
      document.getElementById('menuBtnLanding').innerHTML = currentLang==='tr' ? 'Menü' : 'مینیو';
      renderCategories();
    }

    // ===== EVENTS =====
    document.getElementById('menuBtnLanding').onclick = () => showScreen('menu');

    const globalWrapper = document.getElementById('globalLangBtnWrapper');
    globalWrapper.onclick = (e) => { e.stopPropagation(); globalWrapper.classList.toggle('active'); };
    document.querySelectorAll('#globalLangDropdown div').forEach(opt => {
      opt.onclick = (e) => { e.stopPropagation(); setLanguage(opt.getAttribute('data-lang')); globalWrapper.classList.remove('active'); };
    });

    const menuLangBar = document.getElementById('menuLangBar');
    menuLangBar.onclick = (e) => { e.stopPropagation(); menuLangBar.classList.toggle('active'); };
    document.querySelectorAll('#menuLangDropdown div').forEach(opt => {
      opt.onclick = (e) => { e.stopPropagation(); setLanguage(opt.getAttribute('data-lang')); menuLangBar.classList.remove('active'); };
    });

    document.addEventListener('click', () => { globalWrapper?.classList.remove('active'); menuLangBar?.classList.remove('active'); });

    document.getElementById('foodGridWrap').addEventListener('scroll', function() {
      document.getElementById('scrollTop').classList.toggle('visible', this.scrollTop > 200);
    });

    // ===== INIT =====
    setLanguage('tr');
    renderCategories();
    renderMenu();
  </script>
</body>
</html>
